
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Knowledge AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">AI</div>
      <div>
        <h1 id="ai-name">Knowledge AI</h1>
        <p id="ai-description">知識ベースAIアシスタント</p>
      </div>
      <span class="status" id="status">接続中...</span>
    </header>

    <main id="chat" class="chat">
      <div class="message assistant">
        <div class="avatar">AI</div>
        <div class="bubble">
          こんにちは！何でも質問してください。
          登録された知識データから回答します。
        </div>
      </div>
    </main>

    <div class="loading" id="loading" hidden>
      知識データを検索しています...
    </div>

    <form id="chat-form" class="input-area">
      <textarea
        id="question"
        placeholder="質問を入力してください..."
        rows="1"
        maxlength="2000"
        required
      ></textarea>
      <button id="send" type="submit">送信</button>
    </form>

    <footer>
      Knowledge AI / GitHub Pages Edition
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
